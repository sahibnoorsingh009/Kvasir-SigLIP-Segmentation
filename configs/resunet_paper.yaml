experiment_name: resunet_paper
model:
  name: resunet
  base_channels: 32
  in_channels: 3
  out_channels: 1

data:
  image_dir: /workspace/data/kvasir-seg/download/Kvasir-SEG/Kvasir-SEG/images
  mask_dir: /workspace/data/kvasir-seg/download/Kvasir-SEG/Kvasir-SEG/masks
  internal_train_split: splits/internal_train.txt
  internal_val_split: splits/internal_val.txt
  official_test_split: splits/official_test.txt
  image_size: 320
  num_workers: 8

training:
  seed: 42
  epochs: 150
  batch_size: 8
  optimizer: nadam
  lr: 0.0001
  weight_decay: 0.0
  loss: dice
  threshold: 0.5
  patience: 30
  min_delta: 0.0001
  amp: true
  grad_clip: 1.0
  selection_metric: dice

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.1
  rotate_limit: 20
  scale_limit: 0.15
  brightness_contrast: 0.25
  random_crop_scale_min: 0.85
  coarse_dropout: 0.25

output:
  checkpoint_root: checkpoints
  history_root: results/history
  prediction_root: results/predictions
  qualitative_root: results/qualitative
